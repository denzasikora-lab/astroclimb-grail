[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astroclimb-grail"
version = "0.1.0"
description = "Leakage-safe research pipeline for the AstroCLIMB shared task"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "Pillow>=10",
  "scikit-learn>=1.5",
  "scipy>=1.12",
  "joblib>=1.4",
  "threadpoolctl>=3.5",
]

[project.optional-dependencies]
ml = [
  "torch>=2.3",
  "transformers>=4.48",
  "accelerate>=1.2",
  "safetensors>=0.4",
  "catboost>=1.2",
  "lightgbm>=4.5",
]
dev = [
  "pytest>=8",
  "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
